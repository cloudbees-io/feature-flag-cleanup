apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: AI Feature Flag cleanup.

on:
  workflow_dispatch:
    inputs:
      repo:
        type: string
        required: true
        description: URL of the code repository from which the feature flag will be removed. For example `https://github.com/my-organisation/my-project`
      flag_name:
        type: string
        required: true
        description: Feature flag name.
      replacement_value:
        type: string
        required: true
        description: The value to replace the flag reference with, e.g. true/false (Boolean flags), 'string-value' (String flags), 123.456 (Number flags).

jobs:
  remove-flag:
    permissions:
      scm-token-own: read
      scm-token-org: read
    outputs:
      # Link to the Pull Request for the flag cleanup.
      pr-url: ${{ steps.create-pull-request.outputs.pr-url }}
      # Outcome from the analyze step — surfaced to the publish-evidence
      # job so users see e.g. `unsupported-language` or `timeout`.
      analyze-outcome: ${{ steps.restore-analyze.outputs.outcome }}
      # Files that still reference the flag but the agent could not safely
      # edit — surfaced in evidence so the user knows what to fix by hand.
      analyze-orphaned-files: ${{ steps.restore-analyze.outputs.orphaned-files }}
      # Reasons the agent deferred to needs_manual_review[] when there was
      # zero mechanical work to apply (outcome == manual-review-only) —
      # surfaced in evidence so the user knows why no PR was opened.
      analyze-manual-review-reasons: ${{ steps.restore-analyze.outputs.manual-review-reasons }}
      # Outcome and conflict detail from the apply step — surfaced so
      # publish-evidence can say which file failed and why when apply fails.
      apply-outcome: ${{ steps.restore-apply.outputs.outcome }}
      apply-conflict-detail: ${{ steps.restore-apply.outputs.conflict-detail }}
      # Plain-text digest of the analyze plan (summary, and one "file|reason"
      # entry per planned file, "^"-separated) so a failure message can say
      # what the agent was trying to do, not just which file broke.
      plan-summary: ${{ steps.summarize-plan.outputs.plan-summary }}
      plan-files: ${{ steps.summarize-plan.outputs.plan-files }}

    steps:
      - name: Git global credentials
        uses: cloudbees-io/configure-git-global-credentials@v2
        with:
          repositories: https://github.com/

      - id: checkout-source
        name: Get source code
        uses: cloudbees-io/checkout@v2
        with:
          repository: '${{ inputs.repo }}'

      - id: branch-name
        name: Create branch name
        uses: docker://alpine/git:v2.54.0
        shell: sh
        env:
          FLAG_NAME: ${{ inputs.flag_name }}
        run: |
          SAFE_FLAG_NAME=$(printf '%s' "$FLAG_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          printf '%s' "remove-flag-$SAFE_FLAG_NAME-$(date +"%Y%m%d-%H%M%S")" > "$CLOUDBEES_OUTPUTS/name"

      - id: create-branch
        name: Create branch
        uses: docker://alpine/git:v2.54.0
        shell: sh
        env:
          BRANCH_NAME: ${{ steps.branch-name.outputs.name }}
        run: |
          git checkout -b "$BRANCH_NAME"

      - id: bifrost-config
        name: Get Bifrost config
        uses: ./actions/get-bifrost-config

      # analyze and apply keep their real failure status (the step shows red),
      # but the platform discards a failed step's outputs. The action therefore
      # saves a copy of them in the shared workspace, and the restore-* steps
      # below republish that copy as outputs of a step that succeeds, which is
      # what the job outputs and publish-evidence read. continue-on-error keeps
      # the job going so publish-evidence can run; fail-unreported and fail-run
      # turn the run red afterwards.
      - id: analyze
        name: Analyze flag removal
        uses: ./
        continue-on-error: true
        with:
          mode: analyze
          flag-key: ${{ inputs.flag_name }}
          replacement-value: ${{ inputs.replacement_value }}
          bifrost-base-url: ${{ steps.bifrost-config.outputs.bifrost-base-url }}
          bifrost-vk: ${{ steps.bifrost-config.outputs.bifrost-vk }}

      - id: restore-analyze
        name: Restore analyze outputs
        uses: docker://alpine:3.24
        continue-on-error: true
        shell: sh
        env:
          SAVED: ${{ cloudbees.workspace }}/.flag-cleanup/outputs-analyze
        run: |
          for f in outcome orphaned-files manual-review-reasons; do
            if [ -f "$SAVED/$f" ]; then cp "$SAVED/$f" "$CLOUDBEES_OUTPUTS/$f"; else : > "$CLOUDBEES_OUTPUTS/$f"; fi
          done
          exit 0

      # Any analyze outcome that publish-evidence does not report (timeout,
      # base-unresolvable, scm-prereq-missing, missing-bifrost-creds, or no
      # outcome at all after a crash) must still fail the run, now that
      # analyze itself no longer does. Keep this list in step with the
      # publish-evidence `if:` below.
      - id: fail-unreported
        name: Fail the run for an analyze outcome that publishes no evidence
        uses: docker://alpine:3.24
        if: ${{ steps.restore-analyze.outputs.outcome != 'success' &&
                steps.restore-analyze.outputs.outcome != 'type-mismatch' &&
                steps.restore-analyze.outputs.outcome != 'orphaned-references' &&
                steps.restore-analyze.outputs.outcome != 'manual-review-only' &&
                steps.restore-analyze.outputs.outcome != 'no-matches' &&
                steps.restore-analyze.outputs.outcome != 'unsupported-language' &&
                steps.restore-analyze.outputs.outcome != 'report-syntax-invalid' &&
                steps.restore-analyze.outputs.outcome != 'error' }}
        shell: sh
        env:
          OUTCOME: ${{ steps.restore-analyze.outputs.outcome }}
        run: |
          echo "Analyze ended with outcome '${OUTCOME}', which publishes no evidence. See the Analyze flag removal step logs."
          exit 1

      - id: read-analyze-report
        name: Read analyze report
        uses: docker://alpine:3.24
        if: ${{ steps.analyze.outputs.outcome == 'success' }}
        shell: sh
        env:
          REPORT_PATH: ${{ steps.analyze.outputs.report-path }}
        run: |
          cat "$REPORT_PATH" > "$CLOUDBEES_OUTPUTS/content"

      - id: publish-analyze-report
        name: Publish analyze report
        uses: cloudbees-io/publish-evidence-item@v1
        if: ${{ steps.analyze.outputs.outcome == 'success' }}
        with:
          content: ${{ steps.read-analyze-report.outputs.content }}

      - id: summarize-plan
        name: Summarize the planned edits
        uses: docker://alpine:3.24
        if: ${{ steps.analyze.outputs.outcome == 'success' }}
        continue-on-error: true
        shell: sh
        env:
          REPORT_PATH: ${{ steps.analyze.outputs.report-path }}
        run: |
          # Best-effort context for the failure message in publish-evidence:
          # always leaves both output files in place and never fails the job.
          : > "$CLOUDBEES_OUTPUTS/plan-summary"
          : > "$CLOUDBEES_OUTPUTS/plan-files"
          apk add --no-cache jq >/dev/null 2>&1 || exit 0
          # c() strips characters that could be read as markup or that would
          # break the single-line, "^"-separated format, and caps the length.
          cat > /tmp/summary.jq <<'JQ'
          def c($n): gsub("[\r\n\t`<>^]+"; " ") | gsub(" +"; " ") | .[0:$n];
          (.summary // "") | sub("^[^\n]*Polyglot repo detected[^\n]*\n"; "") | c(700)
          JQ
          cat > /tmp/files.jq <<'JQ'
          def c($n): gsub("[\r\n\t`<>^]+"; " ") | gsub(" +"; " ") | .[0:$n];
          [ ((.planned_edits // [])[] | "\(.file)|\((.confidence_reason // "") | c(300))"),
            ((.planned_deletions // [])[] | "\(.file)|planned deletion: \((.reason // "") | c(300))") ]
          | .[0:30] | join("^")
          JQ
          jq -j -f /tmp/summary.jq "$REPORT_PATH" > "$CLOUDBEES_OUTPUTS/plan-summary" 2>/dev/null || : > "$CLOUDBEES_OUTPUTS/plan-summary"
          jq -j -f /tmp/files.jq "$REPORT_PATH" > "$CLOUDBEES_OUTPUTS/plan-files" 2>/dev/null || : > "$CLOUDBEES_OUTPUTS/plan-files"
          exit 0

      - id: apply
        name: Apply flag removal
        uses: ./
        if: ${{ steps.analyze.outputs.outcome == 'success' }}
        continue-on-error: true
        with:
          mode: apply
          flag-key: ${{ inputs.flag_name }}
          replacement-value: ${{ inputs.replacement_value }}
          report-path: ${{ steps.analyze.outputs.report-path }}
          bifrost-base-url: ${{ steps.bifrost-config.outputs.bifrost-base-url }}
          bifrost-vk: ${{ steps.bifrost-config.outputs.bifrost-vk }}

      - id: restore-apply
        name: Restore apply outputs
        uses: docker://alpine:3.24
        continue-on-error: true
        shell: sh
        env:
          SAVED: ${{ cloudbees.workspace }}/.flag-cleanup/outputs-apply
        run: |
          for f in outcome conflict-detail; do
            if [ -f "$SAVED/$f" ]; then cp "$SAVED/$f" "$CLOUDBEES_OUTPUTS/$f"; else : > "$CLOUDBEES_OUTPUTS/$f"; fi
          done
          exit 0

      - id: stage-changes
        name: Stage git changes
        uses: docker://alpine/git:v2.54.0
        if: ${{ steps.apply.outputs.outcome == 'success' }}
        shell: sh
        run: |
          git add --all

      - id: gh-access-token
        name: Get an SCM access token
        uses: cloudbees-io/get-scm-access-token@v1
        if: ${{ steps.apply.outputs.outcome == 'success' }}
        with:
          repository: ${{ inputs.repo }}

      - id: unify-commit
        name: Commit changes (using API to get signed commit)
        uses: ./actions/unify-commit
        if: ${{ steps.apply.outputs.outcome == 'success' }}
        with:
          scm-token: ${{ steps.gh-access-token.outputs.access-token }}
          commit-message: 'Remove feature flag ${{ inputs.flag_name }}.'

      - id: create-pull-request
        name: Create pull request
        uses: ./actions/create-pull-request
        if: ${{ steps.apply.outputs.outcome == 'success' }}
        with:
          repo: ${{ inputs.repo }}
          head-branch: ${{ steps.branch-name.outputs.name }}
          flag-name: ${{ inputs.flag_name }}
          replacement-value: ${{ inputs.replacement_value }}
          scm-token: ${{ steps.gh-access-token.outputs.access-token }}

  publish-evidence:
    needs: remove-flag
    # Job-level `if:` has no always()/failure() (the engine rejects them), so
    # this is a plain condition on remove-flag's outputs. That only works
    # because analyze and apply are continue-on-error: remove-flag ends
    # without failing, so its outputs are readable here.
    if: ${{ needs.remove-flag.outputs.analyze-outcome == 'success' ||
            needs.remove-flag.outputs.analyze-outcome == 'type-mismatch' ||
            needs.remove-flag.outputs.analyze-outcome == 'orphaned-references' ||
            needs.remove-flag.outputs.analyze-outcome == 'manual-review-only' ||
            needs.remove-flag.outputs.analyze-outcome == 'no-matches' ||
            needs.remove-flag.outputs.analyze-outcome == 'unsupported-language' ||
            needs.remove-flag.outputs.analyze-outcome == 'report-syntax-invalid' ||
            needs.remove-flag.outputs.analyze-outcome == 'error' }}
    steps:
      - id: prepare-evidence
        name: Prepare evidence content
        uses: docker://alpine:3.24
        shell: sh
        env:
          OUTCOME: ${{ needs.remove-flag.outputs.analyze-outcome }}
          APPLY_OUTCOME: ${{ needs.remove-flag.outputs.apply-outcome }}
          APPLY_CONFLICT_DETAIL: ${{ needs.remove-flag.outputs.apply-conflict-detail }}
          FLAG_NAME: ${{ inputs.flag_name }}
          REPLACEMENT_VALUE: ${{ inputs.replacement_value }}
          PR_URL: ${{ needs.remove-flag.outputs.pr-url }}
          ORPHANED_FILES: ${{ needs.remove-flag.outputs.analyze-orphaned-files }}
          MANUAL_REVIEW_REASONS: ${{ needs.remove-flag.outputs.analyze-manual-review-reasons }}
          PLAN_SUMMARY: ${{ needs.remove-flag.outputs.plan-summary }}
          PLAN_FILES: ${{ needs.remove-flag.outputs.plan-files }}
          WORKSPACE_DIR: ${{ cloudbees.workspace }}
        run: |
          # apply always runs after analyze succeeds, so an analyze success
          # with an apply outcome that is not 'success' (including an empty
          # one, after a crash) means the run failed and opened no PR —
          # report that before falling into the OUTCOME switch below, which
          # would otherwise describe it as a successful cleanup.
          if [ "$OUTCOME" = "success" ] && [ "$APPLY_OUTCOME" != "success" ]; then
            # conflict-detail's file-path arrays are too much structure
            # for sed, so use jq here instead of the flat-string sed
            # extraction the other branches below use. Deliberately no
            # diff/edit content is read here — conflict-detail never
            # carries it (see entrypoint.sh's log_apply_conflict); the
            # full diff for every planned file is already published
            # verbatim via the "Publish analyze report" evidence item.
            apk add --no-cache jq >/dev/null 2>&1

            CONFLICT_FILE=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '.file // ""' 2>/dev/null)
            CONFLICT_REASON=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '.reason // ""' 2>/dev/null)
            CONFLICT_MATCHES=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '.matches // ""' 2>/dev/null)
            # The anchored-edit tool reports an absolute workspace path.
            if [ -n "$WORKSPACE_DIR" ]; then CONFLICT_FILE=${CONFLICT_FILE#"$WORKSPACE_DIR"/}; fi
            APPLIED_FILES=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '(.applied_files // [])[]' 2>/dev/null)
            PENDING_EDIT_FILES=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '(.pending_edit_files // [])[]' 2>/dev/null)
            PENDING_DELETION_FILES=$(printf '%s' "$APPLY_CONFLICT_DETAIL" | jq -r '(.pending_deletion_files // [])[]' 2>/dev/null)

            {
              if [ -n "$CONFLICT_FILE" ] && [ "$CONFLICT_REASON" = "post-apply syntax invalid" ]; then
                printf -- '- **Error:** flag `%s` was **not** removed — our syntax check rejected `%s` after the planned edit was applied.\n' \
                  "$FLAG_NAME" "$CONFLICT_FILE"
                printf -- '- If that file looks valid, this may be a limitation of the checker, which does not support some valid constructs (for example a bare `&` in JSX text).\n'
              elif [ -n "$CONFLICT_FILE" ] && [ -n "$CONFLICT_REASON" ]; then
                case "$CONFLICT_REASON" in
                  "before content divergence")
                    printf -- '- **Error:** flag `%s` was **not** removed — `%s` changed after the analysis ran, so it no longer matches the plan.\n' "$FLAG_NAME" "$CONFLICT_FILE" ;;
                  "anchor not unique")
                    if [ "$CONFLICT_MATCHES" = "0" ]; then
                      printf -- '- **Error:** flag `%s` was **not** removed — the text the plan expected to change is no longer in `%s` (it may have changed since the analysis ran).\n' "$FLAG_NAME" "$CONFLICT_FILE"
                    else
                      printf -- '- **Error:** flag `%s` was **not** removed — the planned edit matched more than one place in `%s`, so it was not applied.\n' "$FLAG_NAME" "$CONFLICT_FILE"
                    fi ;;
                  "bad anchored hunk")
                    printf -- '- **Error:** flag `%s` was **not** removed — the plan contained a malformed edit for `%s`.\n' "$FLAG_NAME" "$CONFLICT_FILE" ;;
                  "missing")
                    printf -- '- **Error:** flag `%s` was **not** removed — `%s` no longer exists in the repository.\n' "$FLAG_NAME" "$CONFLICT_FILE" ;;
                  "file too large")
                    printf -- '- **Error:** flag `%s` was **not** removed — `%s` is too large to edit automatically.\n' "$FLAG_NAME" "$CONFLICT_FILE" ;;
                  *)
                    printf -- '- **Error:** flag `%s` was **not** removed — the agent failed to apply the planned edit to `%s`: %s.\n' "$FLAG_NAME" "$CONFLICT_FILE" "$CONFLICT_REASON" ;;
                esac
              else
                case "$APPLY_OUTCOME" in
                  stale-base)
                    printf -- '- **Error:** flag `%s` was **not** removed — the base branch changed while the analysis was running, so the plan may no longer apply. Re-run to analyze the latest code.\n' "$FLAG_NAME" ;;
                  ""|error)
                    printf -- '- **Error:** flag `%s` was **not** removed — the apply step failed.\n' "$FLAG_NAME" ;;
                  *)
                    printf -- '- **Error:** flag `%s` was **not** removed — the apply step failed (outcome: `%s`).\n' "$FLAG_NAME" "$APPLY_OUTCOME" ;;
                esac
              fi
              printf -- '- No changes were committed and no pull request was created.\n'
              if [ -n "$PLAN_FILES" ]; then
                PLAN_COUNT=$(echo "$PLAN_FILES" | tr '^' '\n' | grep -c .)
                PLAN_PATHS=$(echo "$PLAN_FILES" | tr '^' '\n' | sed 's/|.*//; s/.*/`&`/' | tr '\n' ',' | sed 's/,$//; s/,/, /g')
                printf -- '- Planned edits to %s files: %s\n' "$PLAN_COUNT" "$PLAN_PATHS"
              fi
              if [ -n "$PLAN_SUMMARY" ]; then
                printf -- '- **What the agent planned:** %s\n' "$PLAN_SUMMARY"
              fi
              if [ -n "$PLAN_FILES" ]; then
                printf -- '- Planned files and why each was edited:\n'
                echo "$PLAN_FILES" | tr '^' '\n' | while IFS= read -r entry; do
                  [ -n "$entry" ] && printf -- '    - `%s` — %s\n' "${entry%%|*}" "${entry#*|}"
                done
              fi
              if [ -n "$APPLIED_FILES" ]; then
                printf -- '- These files were successfully edited during the attempt, but nothing was committed, so the target repo is unchanged:\n'
                echo "$APPLIED_FILES" | while IFS= read -r f; do [ -n "$f" ] && printf -- '    - `%s`\n' "$f"; done
              fi
              if [ -n "$PENDING_EDIT_FILES" ] || [ -n "$PENDING_DELETION_FILES" ]; then
                printf -- '- These files were planned but never attempted (the run stops at the first failure):\n'
                echo "$PENDING_EDIT_FILES" | while IFS= read -r f; do [ -n "$f" ] && printf -- '    - `%s`\n' "$f"; done
                echo "$PENDING_DELETION_FILES" | while IFS= read -r f; do [ -n "$f" ] && printf -- '    - `%s` (planned deletion)\n' "$f"; done
              fi
              printf -- '- See the "Publish analyze report" evidence item on this run for the full diff of every planned file.\n'
              if [ -n "$CONFLICT_FILE" ]; then
                printf -- '- Re-run to retry — analyze runs fresh each time and may produce a different edit, but for a deterministic bug the error above is likely to repeat; a manual fix to `%s` may be faster.\n' "$CONFLICT_FILE"
              else
                printf -- '- Re-run to retry — analyze runs fresh each time and may produce a different result.\n'
              fi
            } > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "success" ]; then
            printf -- '- Replaced feature flag `%s` with `%s`\n- Pull request: [PR](%s)\n' \
              "$FLAG_NAME" "$REPLACEMENT_VALUE" "$PR_URL" \
              > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "type-mismatch" ]; then
            printf -- '- **Error:** replacement value `%s` is not compatible with the declared type of flag `%s`.\n- Correct the value and re-run.\n' \
              "$REPLACEMENT_VALUE" "$FLAG_NAME" \
              > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "orphaned-references" ]; then
            {
              printf -- '- Flag `%s` was **not** removed — no pull request was created.\n' "$FLAG_NAME"
              printf -- '- These files still reference the flag and could not be edited automatically (usually tests that mock the flag or assert its value):\n'
              if [ -n "$ORPHANED_FILES" ]; then
                echo "$ORPHANED_FILES" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | while IFS= read -r f; do
                  [ -n "$f" ] && printf -- '    - `%s`\n' "$f"
                done
              else
                printf -- '    - See the Analyze flag removal step logs.\n'
              fi
              printf -- '- **To finish the cleanup:** update these files so the flag reference resolves to `%s` (delete a test that only checks the flag; otherwise adjust it to the replacement value), then re-run this workflow or open the pull request manually.\n' "$REPLACEMENT_VALUE"
            } > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "manual-review-only" ]; then
            {
              printf -- '- Flag `%s` was **not** removed — no pull request was created.\n' "$FLAG_NAME"
              printf -- '- The cleanup agent found no reference it could safely rewrite mechanically:\n'
              if [ -n "$MANUAL_REVIEW_REASONS" ]; then
                echo "$MANUAL_REVIEW_REASONS" | tr ';' '\n' | sed 's/^ *//; s/ *$//' | while IFS= read -r r; do
                  [ -n "$r" ] && printf -- '    - %s\n' "$r"
                done
              else
                printf -- '    - See the Analyze flag removal step logs.\n'
              fi
              printf -- '- **To finish the cleanup:** update the code by hand so it behaves as if `%s` returned `%s`, then remove the flag from CloudBees Platform.\n' "$FLAG_NAME" "$REPLACEMENT_VALUE"
            } > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "no-matches" ]; then
            printf -- '- No references to flag `%s` were found — no changes made.\n' \
              "$FLAG_NAME" \
              > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "unsupported-language" ]; then
            printf -- '- **Error:** the target repository language is not supported. No changes made.\n' \
              > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "report-syntax-invalid" ]; then
            printf -- '- **Error:** the agent produced a syntactically invalid edit for flag `%s`. No changes made. Re-run to retry.\n' \
              "$FLAG_NAME" \
              > "$CLOUDBEES_OUTPUTS/content"
          elif [ "$OUTCOME" = "orphaned-references" ]; then
            printf -- '- **Error:** removing flag `%s` would leave references behind that were not updated, which would break the build. No changes made. Re-run to retry.\n' \
              "$FLAG_NAME" \
              > "$CLOUDBEES_OUTPUTS/content"
          else
            printf -- '- **Error:** flag cleanup for `%s` ended with outcome `%s`. Check the step logs for details.\n' \
              "$FLAG_NAME" "$OUTCOME" \
              > "$CLOUDBEES_OUTPUTS/content"
          fi

      - id: publish-evidence
        name: Publish evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.prepare-evidence.outputs.content }}

      # analyze and apply no longer fail remove-flag, so fail the run here,
      # after the evidence is published. Outcomes that exit 0 in the agent
      # (type-mismatch, orphaned-references, manual-review-only, no-matches)
      # stay green, as they always have.
      - id: fail-run
        name: Fail the run when the cleanup did not succeed
        uses: docker://alpine:3.24
        if: ${{ needs.remove-flag.outputs.analyze-outcome == 'unsupported-language' ||
                needs.remove-flag.outputs.analyze-outcome == 'report-syntax-invalid' ||
                needs.remove-flag.outputs.analyze-outcome == 'error' ||
                (needs.remove-flag.outputs.analyze-outcome == 'success' &&
                 needs.remove-flag.outputs.apply-outcome != 'success') }}
        shell: sh
        env:
          ANALYZE_OUTCOME: ${{ needs.remove-flag.outputs.analyze-outcome }}
          APPLY_OUTCOME: ${{ needs.remove-flag.outputs.apply-outcome }}
        run: |
          echo "Cleanup did not succeed (analyze: '${ANALYZE_OUTCOME}', apply: '${APPLY_OUTCOME}'). The evidence above explains why."
          exit 1

apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: "Clean up a feature flag with Claude Code"
description: "AI-driven feature flag cleanup action. Analyzes a repository and removes a specified feature flag, replacing all call sites with the given replacement value, then opens a pull request."

inputs:
  mode:
    description: "Dispatch keyword: analyze | apply"
    required: true
  flag-key:
    description: "Flag key to remove. Single key; one-flag-per-invocation (v0.1)."
    required: true
  replacement-value:
    description: "Literal to substitute at call sites. Must match the flag's declared type — boolean ('true' or 'false'), string, or number (integer or floating-point). The skill validates this against the flag's SDK declaration."
    required: false
  language:
    description: "Source language of the target repo: 'go'|'js'|'ts'|'py'|'java'. When unset, the entrypoint auto-detects by manifest priority (go > ts > js > py > java). Pass explicitly in polyglot repos to override auto-detection."
    required: false
  report-path:
    description: "Absolute path to the analyze-mode report. Required in apply mode; pass through ${{ steps.<analyze>.outputs.report-path }}."
    required: false
  base-branch:
    description: "Upstream branch to use as the analyze base. Defaults to the remote's default branch (origin/HEAD). Pass explicitly when cleaning a flag from a non-default branch."
    required: false
  bifrost-base-url:
    description: "Bifrost gateway base URL"
    required: true
  bifrost-vk:
    description: "Bifrost virtual key. Sourced from a component-level secret in the calling workflow."
    required: true
  model:
    description: "Bifrost model alias to drive Claude Code with."
    required: false
    default: claude-5-5-opus-global

outputs:
  report-path:
    description: "Absolute path to the analyze-mode report.json (under $WORKSPACE/.flag-cleanup/, excluded from the PR via .git/info/exclude)."
    value: ${{ steps.run-agent.outputs.report-path }}
  outcome:
    description: "Canonical outcome code. See spec.md Outcome Codes table."
    value: ${{ steps.run-agent.outputs.outcome }}
  files-modified:
    description: "Count of files edited (apply modes only)."
    value: ${{ steps.run-agent.outputs.files-modified }}
  orphaned-files:
    description: "Comma-separated files that still reference the flag but were not covered by the plan. Set only when outcome is orphaned-references; surfaced in evidence to guide the manual fix."
    value: ${{ steps.run-agent.outputs.orphaned-files }}
  manual-review-reasons:
    description: "Semicolon-separated needs_manual_review[] reasons. Set only when outcome is manual-review-only (zero mechanical edits possible — e.g. dynamic flag-key construction); surfaced in evidence to explain why no PR was opened."
    value: ${{ steps.run-agent.outputs.manual-review-reasons }}
  conflict-detail:
    description: "JSON object for the apply_conflict that caused outcome=error during apply mode: {file, reason, attempted, applied_files, pending_edit_files, pending_deletion_files}. attempted is the full planned_edits[]/planned_deletions[] entry that failed (the exact edit the agent tried); applied_files/pending_*_files split the rest of the plan by whether apply reached them before the conflict. Not every field is always present (the report-parse failure sites only set file/reason). Empty on every other outcome; surfaced in evidence so the user sees the failure, the exact attempted edit, and the full planned scope — not just that it failed."
    value: ${{ steps.run-agent.outputs.conflict-detail }}

runs:
  using: composite
  steps:
    - id: run-agent
      uses: docker://public.ecr.aws/l7o7z1g8/actions/unify-ai-flag-cleanup-agent:main-a5e174b882ceaaad8946996abb0006d7abf63512
      shell: bash
      run: |
        rc=0
        /usr/local/bin/entrypoint.sh || rc=$?
        # The platform discards a step's outputs when it exits non-zero, so keep
        # a copy in the shared workspace (excluded from the PR by the entrypoint)
        # for a later workflow step to republish. The exit code is unchanged.
        if [ -n "${WORKSPACE:-}" ] && [ -n "${MODE:-}" ]; then
          saved="$WORKSPACE/.flag-cleanup/outputs-$MODE"
          rm -rf "$saved"
          mkdir -p "$saved" && cp -f "$CLOUDBEES_OUTPUTS"/* "$saved"/ 2>/dev/null || true
        fi
        exit "$rc"
      env:
        MODE:                             ${{ inputs.mode }}
        FLAG_KEY:                         ${{ inputs.flag-key }}
        REPLACEMENT_VALUE:                ${{ inputs.replacement-value }}
        LANGUAGE_INPUT:                   ${{ inputs.language }}
        REPORT_PATH:                      ${{ inputs.report-path }}
        BASE_BRANCH_INPUT:                ${{ inputs.base-branch }}
        WORKSPACE:                        ${{ cloudbees.workspace }}
        BIFROST_BASE_URL:                 ${{ inputs.bifrost-base-url }}
        BIFROST_VK:                       ${{ inputs.bifrost-vk }}
        MODEL:                            ${{ inputs.model }}

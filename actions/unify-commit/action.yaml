apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: unify-commit
description: "'git commit' staged changes, using the GitHub API. This results in a signed/verified commit (which a plain 'git commit' using the GitHub App token would not produce)"
inputs:
  scm-token:
    description: "The SCM authentication token."
    required: false
    default: ${{ cloudbees.scm.token }}
  commit-message:
    description: "The commit message."
    required: true

runs:
  using: composite
  steps:
    - id: gh-api-commit
      name: Commit staged changes using the GitHub API (verified commit).
      uses: docker://alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.scm-token }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        apk add --no-cache bash jq curl git

        cat > /tmp/commit.sh << 'BASH_EOF'
        set -euo pipefail

        # GitHub REST API base + auth headers, reused by every call below.
        API="https://api.github.com"
        AUTH="Authorization: Bearer $GH_TOKEN"
        ACCEPT="Accept: application/vnd.github+json"

        # Request and response bodies are always passed via files/stdin, never as command-line arguments: Linux limits
        # a single argument to 128 KiB, which a base64-encoded source file can easily exceed.
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT

        # api_post STAGE URL BODY_FILE [METHOD]: send BODY_FILE (POST unless METHOD is given) and print the response body. On failure, names the stage that
        # failed and shows GitHub's response.
        api_post() {
            local stage="$1" url="$2" body_file="$3" method="${4:-POST}" response_file="$WORK_DIR/response.json"
            rm -f "$response_file"
            if ! curl --fail-with-body --silent --show-error \
                    -X "$method" --header "$AUTH" --header "$ACCEPT" \
                    --data-binary @"$body_file" --output "$response_file" "$url"; then
                echo "Error: GitHub API call failed while creating the $stage" >&2
                [ ! -s "$response_file" ] || cat "$response_file" >&2
                exit 1
            fi
            cat "$response_file"
        }

        # json_sha STAGE: read an API response from stdin and print its .sha, failing if there isn't one.
        json_sha() {
            local sha
            sha=$(jq -r '.sha // empty')
            if [ -z "$sha" ]; then
                echo "Error: GitHub API response for the $1 contained no sha" >&2
                exit 1
            fi
            echo "$sha"
        }

        if [ -z "$COMMIT_MESSAGE" ]; then
            echo "Error: Commit message is required (input: commit-message)"
            exit 1
        fi

        REMOTE_URL=$(git config --get remote.origin.url)
        if [ -z "$REMOTE_URL" ]; then
            echo "Error: No remote 'origin' configured"
            exit 1
        fi

        if [[ "$REMOTE_URL" =~ github\.com[:/]([^/]+)/([^/]+)(\.git)?$ ]]; then
            OWNER="${BASH_REMATCH[1]}"
            REPO_NAME="${BASH_REMATCH[2]%.git}"
            REPO="$OWNER/$REPO_NAME"
        else
            echo "Error: Could not parse GitHub repository from remote URL: $REMOTE_URL"
            exit 1
        fi

        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        BASE_COMMIT=$(git rev-parse HEAD)

        if git diff --cached --quiet; then
            echo "Error: No changes staged for commit. Use 'git add' first."
            exit 1
        fi

        echo "Creating commit via GitHub API..."
        echo "Repository: $REPO"
        echo "Branch: $CURRENT_BRANCH"
        echo "Base commit: ${BASE_COMMIT:0:8}"

        BASE_TREE=$(curl --fail-with-body --silent --show-error \
            --header "$AUTH" --header "$ACCEPT" \
            "$API/repos/$REPO/git/commits/$BASE_COMMIT" | jq -r '.tree.sha')
        TREE_ENTRIES_FILE="$WORK_DIR/tree-entries.ndjson"
        : > "$TREE_ENTRIES_FILE"

        while IFS=$'\t' read -r STATUS OLD_FILE NEW_FILE; do
            case "$STATUS" in
                D*)
                    FILE="$OLD_FILE"
                    ;;
                R*|C*)
                    FILE="$NEW_FILE"
                    ;;
                *)
                    FILE="$OLD_FILE"
                    ;;
            esac

            if [[ "$STATUS" == D* ]]; then
                jq -cn --arg path "$FILE" \
                    '{"path": $path, "mode": "100644", "type": "blob", "sha": null}' >> "$TREE_ENTRIES_FILE"
            else
                if [[ "$STATUS" == R* ]]; then
                    jq -cn --arg path "$OLD_FILE" \
                        '{"path": $path, "mode": "100644", "type": "blob", "sha": null}' >> "$TREE_ENTRIES_FILE"
                fi

                # Streamed to a file rather than held in a variable or argument. Base64 output contains only
                # [A-Za-z0-9+/=], so it needs no JSON escaping.
                BLOB_REQUEST_FILE="$WORK_DIR/blob.json"
                {
                    printf '{"encoding":"base64","content":"'
                    git show ":$FILE" | base64 | tr -d '\n'
                    printf '"}'
                } > "$BLOB_REQUEST_FILE"
                BLOB_SHA=$(api_post "blob for $FILE" "$API/repos/$REPO/git/blobs" "$BLOB_REQUEST_FILE" \
                    | json_sha "blob for $FILE")

                MODE=$(git ls-files -s "$FILE" | awk '{print $1}')
                if [ -z "$MODE" ]; then
                    if [ -x "$FILE" ]; then
                        MODE="100755"
                    else
                        MODE="100644"
                    fi
                fi

                jq -cn \
                    --arg path "$FILE" \
                    --arg sha "$BLOB_SHA" \
                    --arg mode "$MODE" \
                    '{"path": $path, "mode": $mode, "type": "blob", "sha": $sha}' >> "$TREE_ENTRIES_FILE"
            fi
        done < <(git diff --cached --name-status)

        TREE_REQUEST_FILE="$WORK_DIR/tree.json"
        jq -s --arg base_tree "$BASE_TREE" '{base_tree: $base_tree, tree: .}' "$TREE_ENTRIES_FILE" > "$TREE_REQUEST_FILE"
        NEW_TREE=$(api_post "tree" "$API/repos/$REPO/git/trees" "$TREE_REQUEST_FILE" | json_sha "tree")

        COMMIT_REQUEST_FILE="$WORK_DIR/commit.json"
        printf '%s' "$COMMIT_MESSAGE" | jq -Rs --arg tree "$NEW_TREE" --arg parent "$BASE_COMMIT" \
            '{message: ., tree: $tree, parents: [$parent]}' > "$COMMIT_REQUEST_FILE"
        NEW_COMMIT=$(api_post "commit" "$API/repos/$REPO/git/commits" "$COMMIT_REQUEST_FILE" | json_sha "commit")

        REF_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "$AUTH" --header "$ACCEPT" \
            "$API/repos/$REPO/git/refs/heads/$CURRENT_BRANCH")

        REF_REQUEST_FILE="$WORK_DIR/ref.json"
        if [ "$REF_STATUS" = "200" ]; then
            jq -n --arg sha "$NEW_COMMIT" '{sha: $sha}' > "$REF_REQUEST_FILE"
            api_post "branch update" "$API/repos/$REPO/git/refs/heads/$CURRENT_BRANCH" "$REF_REQUEST_FILE" PATCH \
                > /dev/null
        else
            jq -n --arg ref "refs/heads/$CURRENT_BRANCH" --arg sha "$NEW_COMMIT" \
                '{ref: $ref, sha: $sha}' > "$REF_REQUEST_FILE"
            api_post "branch" "$API/repos/$REPO/git/refs" "$REF_REQUEST_FILE" > /dev/null
        fi

        git fetch origin "$CURRENT_BRANCH"
        git update-ref "refs/heads/$CURRENT_BRANCH" "$NEW_COMMIT"
        git reset --mixed "$NEW_COMMIT"

        echo "Created verified commit: ${NEW_COMMIT:0:8}"
        echo "Message: $COMMIT_MESSAGE"
        echo "Updated remote branch: $CURRENT_BRANCH"
        BASH_EOF

        bash /tmp/commit.sh
